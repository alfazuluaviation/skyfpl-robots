name: 🤖 REA/REH/REUL Crawler — Sincronização por Ciclo AIRAC

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: '🧪 Forçar execução ignorando janela de data AIRAC?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Simulação / Teste sem alterar dados de produção?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      cycle:
        description: 'Ciclo AIRAC específico (opcional, ex: 2609)'
        required: false
        default: ''
      publish_prod:
        description: '🚀 Publicar malha diretamente em Produção (latest_rea_vfr.json)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 4 * * *'    # Executa diariamente às 04:00 UTC

jobs:
  sync_rea_vfr:
    name: Sincronizar Corredores e Fixos REA/REH/REUL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    concurrency:
      group: rea-vfr-sync
      cancel-in-progress: true

    steps:
    - name: 📥 Checkout do código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: rea-robot/requirements.txt

    - name: 📦 Instalar Dependências
      working-directory: rea-robot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🤖 Executar Robô Híbrido REA/REH/REUL
      working-directory: rea-robot
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        FORCE_RUN: ${{ github.event.inputs.force_run }}
      run: |
        ARGS=""
        if [ "${{ github.event.inputs.force_run }}" == "true" ]; then
          ARGS="$ARGS --force"
        fi
        if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
          ARGS="$ARGS --dry-run"
        fi
        if [ -n "${{ github.event.inputs.cycle }}" ]; then
          ARGS="$ARGS --cycle ${{ github.event.inputs.cycle }}"
        fi
        if [ "${{ github.event.inputs.publish_prod }}" == "true" ]; then
          ARGS="$ARGS --publish-prod"
        fi
        python sync_rea_vfr.py $ARGS
