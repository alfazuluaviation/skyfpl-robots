name: 🤖 AIP Master Auditor — Reconciliação Documental DECEA

on:
  schedule:
    - cron: '0 3 * * *' # Diário às 00:00 Horário de Brasília (03:00 UTC)
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Ciclo AIRAC Específico (ex: 2609)'
        required: false
        default: ''
      force_run:
        description: '🧪 Forçar re-auditoria ignorando se o ciclo já foi consolidado?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

jobs:
  audit_aip:
    name: 📑 Reconciliação Documental AIP & Cross-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install -r aip-auditor-robot/requirements.txt

      - name: 🚀 Executar AIP Master Auditor
        env:
          AISWEB_API_KEY: ${{ secrets.AISWEB_API_KEY || secrets.DECEA_API_KEY }}
          AISWEB_API_PASS: ${{ secrets.AISWEB_API_PASS || secrets.DECEA_API_PASS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_CHARTS: ${{ secrets.R2_BUCKET_CHARTS || 'skyfpl-charts' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          python aip-auditor-robot/aip_auditor.py ${{ github.event.inputs.cycle && format('--cycle {0}', github.event.inputs.cycle) || '' }} ${{ github.event.inputs.force_run == 'true' && '--force' || '' }}

      # Notificação de Emergência no Telegram se o Runner Falhar (Fallback de Infraestrutura)
      - name: 🚨 Notificar Falha Crítica no Telegram & Supabase
        if: failure() || cancelled()
        working-directory: aip-auditor-robot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gongoqjjpwphhttumdjm.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f .python_alert_sent ]; then
            echo "ℹ️ O script Python já despachou o alerta detalhado no Telegram. Fallback de runner silenciado para evitar duplicidade."
            exit 0
          fi
          curl -s -X POST "$SUPABASE_URL/functions/v1/airac-aip-ingest" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "FAILED",
              "cycle": "2609",
              "layer": "GitHub Actions Runner (AIP Auditor Nuvem)",
              "error": "O executor da auditoria documental AIP foi interrompido inesperadamente na infraestrutura da nuvem."
            }' || true
