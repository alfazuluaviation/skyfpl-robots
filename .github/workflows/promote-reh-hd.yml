name: 🚀 REH GeoPDF HD — Promoção Oficial para Produção (reh/)

on:
  workflow_dispatch:
    inputs:
      target_codes:
        description: 'Setores para promoção (ex: REH_XP2_SAO_PAULO_1 ou XP2_SAO_PAULO_1,WJ2 ou ALL)'
        required: false
        default: 'ALL'

concurrency:
  group: reh-geopdf-hd-promoter
  cancel-in-progress: false

jobs:
  promote_reh:
    name: Promover Setores REH HD para reh/
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: reh-geopdf-robot/requirements.txt

      - name: 📦 Instalar Dependências Python
        working-directory: reh-geopdf-robot
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests

      - name: 🚀 Executar Promoção Server-Side no Cloudflare R2
        working-directory: reh-geopdf-robot
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY || secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY || secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || 'skyfpl-charts' }}
          TARGET_CODES: ${{ github.event.inputs.target_codes || 'ALL' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python promote_reh_to_prod.py

      - name: 🚨 Notificar Falha no Telegram (Fallback de Infraestrutura)
        if: cancelled() || failure()
        working-directory: reh-geopdf-robot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID')
          if os.path.exists('.python_alert_sent'):
              print('ℹ️ Alerta já despachado pelo script Python. Fallback silenciado.')
          elif token and chat:
              msg = '🚨 <b>ALERTA CRÍTICO DE INFRAESTRUTURA — PROMOÇÃO REH HD</b>\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n⚠️ O runner do GitHub Actions falhou ou foi cancelado durante a transferência para produção.\n❌ <b>Status:</b> RUNNER FAILED'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          " || true

      - name: 📊 Registrar Sumário da Execução
        if: always()
        run: |
          echo "## 🚀 Relatório de Promoção — REH GeoPDF HD" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Setores HD Transferidos** | \`reh/{codigo}.mbtiles\` e \`reh/{codigo}.pmtiles\` (Quarentena limpa) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Execução** | **${{ job.status }}** |" >> $GITHUB_STEP_SUMMARY
