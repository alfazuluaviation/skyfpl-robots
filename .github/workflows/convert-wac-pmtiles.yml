name: 🌐 WAC GeoPDF HD — Converter & Publicar PMTiles (Site Web)

on:
  workflow_dispatch:

concurrency:
  group: wac-pmtiles-converter
  cancel-in-progress: false

jobs:
  convert_pmtiles:
    name: Converter 46 Cartas WAC para PMTiles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: wac-geopdf-robot/requirements.txt

      - name: 📦 Instalar Dependências (boto3 + pmtiles)
        working-directory: wac-geopdf-robot
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pmtiles

      - name: 🚀 Executar Conversão e Upload PMTiles no Cloudflare R2
        working-directory: wac-geopdf-robot
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY || secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY || secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || 'skyfpl-charts' }}
        run: |
          python convert_and_upload_pmtiles.py

      - name: 📊 Registrar Sumário da Execução
        if: always()
        run: |
          echo "## 🌐 Relatório de Publicação PMTiles — WAC GeoPDF HD" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **46 Cartas PMTiles** | Publicadas em \`wac/WAC{codigo}.pmtiles\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cache CDN** | \`public, max-age=2592000, immutable\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Compatibilidade Site Web** | Range Requests diretos ativos |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Execução** | **${{ job.status }}** |" >> $GITHUB_STEP_SUMMARY
