name: 🔬 Auditoria GDAL de Neatline ENRC H (DECEA Oficial vs. L)

on:
  workflow_dispatch:
    inputs:
      chart_code:
        description: 'Carta ENRC H para auditar contra DECEA (ex: H1 ou H2)'
        required: true
        default: 'H1'
  push:
    paths:
      - 'enrc-high-geopdf-robot/audit_trigger.txt'
      - '.github/workflows/audit-enrch-neatline.yml'

jobs:
  audit_neatline:
    name: Auditar Geometria de Carta ENRC H
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🌍 Instalar GDAL Nativo e Python GDAL
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin python3-gdal libgdal-dev
          echo "=== Versão do GDAL ==="
          gdalinfo --version
          /usr/bin/python3 -c "from osgeo import gdal; print('✅ GDAL Python binding OK:', gdal.__version__)"

      - name: 🔬 Executar Auditoria Comparativa do GeoTIFF DECEA
        run: |
          CHART="H1"
          if [ -f "enrc-high-geopdf-robot/audit_trigger.txt" ]; then
            FILE_CHART=$(cat enrc-high-geopdf-robot/audit_trigger.txt | tr -d '[:space:]')
            if [ -n "$FILE_CHART" ]; then
              CHART="$FILE_CHART"
            fi
          fi
          if [ -n "${{ inputs.chart_code }}" ]; then
            CHART="${{ inputs.chart_code }}"
          fi
          echo "🎯 Auditando Carta: $CHART"
          /usr/bin/python3 enrc-high-geopdf-robot/audit_enrch_neatline.py --chart "$CHART"

      - name: 📤 Salvar Artefato de Auditoria
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-result
          path: enrc-high-geopdf-robot/audit_result_*.json
          retention-days: 7
