name: 🤖 NavData Crawler — Sincronização por Ciclo AIRAC

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Número de workers (threads) para o processamento (1 a 50)'
        required: false
        default: '10'
      force_run:
        description: '🧪 Forçar execução ignorando janela de data AIRAC?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Simulação / Teste sem alterar dados de produção?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: '0 3 * * *'    # Executa diariamente às 03:00 UTC

jobs:
  sync_navdata:
    name: Sincronizar NavData
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    concurrency:
      group: navdata-sync
      cancel-in-progress: true

    steps:
    - name: 📥 Checkout do código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: navdata-robot/requirements.txt

    - name: 📦 Instalar Dependências
      working-directory: navdata-robot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🤖 Executar Robô NavData
      working-directory: navdata-robot
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      run: |
        python sync_navdata.py --workers ${{ github.event.inputs.workers || '10' }}

    # Mecanismo de Autorrecuperação (Self-Healing)
    - name: 🔄 Auto-reiniciar se interrompido (Self-Healing)
      if: failure() || cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "⚡ Job interrompido ou falhou. Disparando novo run para autorrecuperação..."
        gh workflow run navdata_sync.yml --repo "${{ github.repository }}"
