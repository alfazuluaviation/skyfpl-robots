name: 🧭 ARINC 424 Procedures Robot — Coding Tables & Staging Compiler

on:
  workflow_dispatch:
    inputs:
      icao_code:
        description: 'Aeródromos ICAO (separados por vírgula ou preset: TOP4, RJSP, NORDESTE)'
        required: false
        default: 'SBSV,SBGR,SBRJ,SBBR'
      airac_cycle:
        description: 'Ciclo AIRAC (Ex: 2610 ou AUTO)'
        required: false
        default: 'AUTO'
      dry_run:
        description: 'Modo Simulação'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # Execução de revalidação periódica às quintas-feiras às 04:00 UTC (alinhado aos ciclos AIRAC)
  schedule:
    - cron: '0 4 * * 4'

jobs:
  process_arinc424:
    name: Extrair e Compilar Procedimentos ARINC 424
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: arinc424-procedures-sync
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: arinc424-robot/requirements.txt

      - name: 📦 Instalar Dependências
        working-directory: arinc424-robot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛰️ Executar Robô ARINC 424 (DECEA AISWEB + Supabase + Staging R2)
        working-directory: arinc424-robot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://gongoqjjpwphhttumdjm.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'skyfpl-charts' }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || 'https://pub-1b4a512269cb4fc496e8badb21acf51c.r2.dev' }}
          AISWEB_API_KEY: ${{ secrets.AISWEB_API_KEY }}
          AISWEB_API_PASS: ${{ secrets.AISWEB_API_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.icao_code }}" ]; then
            ARGS="$ARGS --icao ${{ github.event.inputs.icao_code }}"
          else
            ARGS="$ARGS --icao SBSV,SBGR,SBRJ,SBBR"
          fi
          if [ -n "${{ github.event.inputs.airac_cycle }}" ]; then
            ARGS="$ARGS --airac ${{ github.event.inputs.airac_cycle }}"
          else
            ARGS="$ARGS --airac AUTO"
          fi
          ARGS="$ARGS --dry-run ${{ github.event.inputs.dry_run || 'false' }}"

          echo "🚀 Executando: python sync_arinc424.py $ARGS"
          python sync_arinc424.py $ARGS

      - name: 🚨 Notificar Falha no Telegram (Fallback)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=Markdown" \
              -d "text=🚨 *FALHA NO WORKFLOW ARINC 424 PROCEDURES*%0A%0A*Runner:* GitHub Actions%0A*Workflow:* process-arinc424-procedures.yml%0A*Status:* Execução interrompida com erro." || true
          fi
