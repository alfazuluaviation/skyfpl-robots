name: 🚀 REUL GeoPDF HD — Promoção Oficial para Produção (reul/)

on:
  workflow_dispatch:
    inputs:
      target_codes:
        description: 'Setores para promoção (ex: REUL_WJ3_RIO_DE_JANEIRO ou WJ3 ou ALL)'
        required: false
        default: 'ALL'

concurrency:
  group: reul-geopdf-hd-promoter
  cancel-in-progress: false

jobs:
  promote_reul:
    name: Promover Setores REUL HD para reul/
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: reul-geopdf-robot/requirements.txt

      - name: 📦 Instalar Dependências Python
        working-directory: reul-geopdf-robot
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests

      - name: 🚀 Executar Promoção Server-Side no Cloudflare R2
        working-directory: reul-geopdf-robot
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY || secrets.R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY || secrets.R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.CLOUDFLARE_R2_BUCKET || 'skyfpl-charts' }}
          TARGET_CODES: ${{ github.event.inputs.target_codes || 'ALL' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python promote_reul_to_prod.py

      - name: 🚨 Notificar Falha no Telegram (Fallback de Infraestrutura)
        if: cancelled() || failure()
        working-directory: reul-geopdf-robot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat = os.environ.get('TELEGRAM_CHAT_ID')
          if token and chat:
              msg = '🚨 <b>FALHA NA PROMOÇÃO REUL HD</b>\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n❌ A promoção de setores de ultraleves falhou no runner.'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          " || true

      - name: 📊 Registrar Sumário da Execução
        if: always()
        run: |
          echo "## 🚀 Relatório de Promoção — REUL GeoPDF HD" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Filtro Selecionado** | \`${{ github.event.inputs.target_codes }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status da Execução** | **${{ job.status }}** |" >> $GITHUB_STEP_SUMMARY
