name: 🤖 ROTAER Crawler — Sincronização por Ciclo AIRAC

on:
  workflow_dispatch:        # Permite disparo manual pelo painel do GitHub Actions
    inputs:
      force_run:
        description: '🧪 Forçar execução (ignorar verificação de data AIRAC)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_aerodromes:
        description: '✂️ Limite de aeródromos (0 = processar TODOS, ex: 5 para teste)'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0 2 * * *'    # Executa todo dia às 02:00 UTC (verifica se é hora de rodar)

jobs:
  run-crawler:
    name: Executar Crawler ROTAER
    runs-on: ubuntu-latest
    timeout-minutes: 360   # Limite de 6h por sessão (o checkpoint garante continuidade)

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: skyfpl-rotaer-crawler/package-lock.json

      - name: 📦 Instalar Dependências
        working-directory: skyfpl-rotaer-crawler
        run: npm ci

      - name: 🤖 Executar Crawler (com Checkpoint + Inteligência AIRAC)
        id: crawler
        working-directory: skyfpl-rotaer-crawler
        run: node index.js
        env:
          # ── Supabase ─────────────────────────────────────────────
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # ── Cloudflare R2 ─────────────────────────────────────────
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # ── Modo de Teste (definidos pelos inputs manuais) ────────
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          MAX_AERODROMES: ${{ github.event.inputs.max_aerodromes || '0' }}

      - name: 📋 Verificar Arquivo de Snapshot Gerado
        if: always()
        working-directory: skyfpl-rotaer-crawler
        run: |
          if [ -f rotaer_snapshot.json ]; then
            echo "✅ Snapshot gerado com sucesso"
            echo "📦 Tamanho: $(du -sh rotaer_snapshot.json | cut -f1)"
          else
            echo "⚠️  Snapshot não encontrado localmente (normal se o upload para R2 foi direto)"
          fi

      # ── AUTO-REINÍCIO: se o crawler foi interrompido antes de terminar,
      #    dispara um novo job automaticamente para retomar do checkpoint ──────
      - name: 🔄 Auto-reiniciar se interrompido (Self-Healing)
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⚡ Job interrompido. Verificando se há checkpoint no R2 para retomar..."
          
          CHECKPOINT_URL="https://pub-1b4a512269cb4fc496e8badb21acf51c.r2.dev/rotaer/rotaer_$(date -u +%Y%m%d)_checkpoint.json"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CHECKPOINT_URL" 2>/dev/null || echo "000")
          
          # Tenta também a URL sem data (procura por qualquer checkpoint do ciclo atual)
          # O nome exato depende do ciclo AIRAC — checamos via listagem simples
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "403" ]; then
            echo "♻️  Checkpoint detectado (HTTP $HTTP_STATUS). Disparando novo run automaticamente..."
            gh workflow run rotaer_crawler.yml \
              --repo "${{ github.repository }}" \
              --field force_run="${{ github.event.inputs.force_run || 'false' }}" \
              --field max_aerodromes="${{ github.event.inputs.max_aerodromes || '0' }}"
            echo "✅ Novo run disparado! O robô retomará de onde parou."
          else
            echo "ℹ️  Nenhum checkpoint encontrado (HTTP $HTTP_STATUS). Nenhuma ação necessária."
            echo "   (Pode ter sido um encerramento antes de qualquer dado ser coletado)"
          fi
