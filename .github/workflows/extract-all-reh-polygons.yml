name: 🗺️ Extração de Polígonos Oficiais REH (12 Folhas DECEA)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_all_reh:
    name: Extrair Polígonos e BBOXes Oficiais REH (12 Folhas)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🌍 Instalar GDAL Nativo e Python GDAL
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gdal-bin python3-gdal libgdal-dev
          echo "=== Versão do GDAL ==="
          gdalinfo --version
          python3 -c "from osgeo import gdal; print('✅ GDAL Python OK:', gdal.__version__)"

      - name: 📦 Instalar Dependências Python
        working-directory: reh-geopdf-robot
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 Executar Extração das 12 Folhas REH
        working-directory: reh-geopdf-robot
        run: |
          python3 extract_all_reh_polygons.py

      - name: 💾 Commit & Push dos Polígonos Canônicos no Repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reh-geopdf-robot/reh_catalog.json reh-geopdf-robot/reh_official_polygons.json
          git commit -m "chore(cartography): update official REH neatlines and BBOXes extracted from DECEA" || echo "Nenhuma alteração detectada"
          git push origin main

      - name: 📤 Salvar Artefato dos Polígonos e Catálogo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reh-official-polygons-and-catalog
          path: |
            reh-geopdf-robot/reh_catalog.json
            reh-geopdf-robot/reh_official_polygons.json
          retention-days: 30
